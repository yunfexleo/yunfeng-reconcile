# 本地开发用 PostgreSQL（题目要求的存储）。
# 启动：docker compose up -d db
# 连接串：postgres://stability:stability@localhost:5432/stability
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stability
      POSTGRES_PASSWORD: stability
      POSTGRES_DB: stability
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

volumes:
  pgdata:
